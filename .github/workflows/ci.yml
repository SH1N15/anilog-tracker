name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:all

      - name: Build Android web assets
        run: npm run build:android

      - name: Build Tauri web assets
        run: |
          npm run build:tauri:web
          npm run build:tauri-original:web

      - name: Test Tauri shared core
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features standard
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features original

      - name: Test edition separation
        run: npm run test:editions

      - name: Test state refresh race handling
        run: npm run test:state-refresh

      - name: Test unfollow task retention
        run: npm run test:task-retention

      - name: Test daily task reminders
        run: npm run test:daily-task-reminder

      - name: Test window lifecycle
        run: npm run test:window-lifecycle

      - name: Test WebDAV merge and transport
        run: |
          npm run test:webdav-sync
          npm run test:webdav-service

      - name: Test cache storage
        run: npm run test:cache-storage

      - name: Test season cache
        run: npm run test:season-cache

      - name: Test season grouping and date precision
        run: npm run test:season-grouping

      - name: Test data migration
        run: npm run test:data

      - name: Test Bangumi matching
        run: npm run test:bangumi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
