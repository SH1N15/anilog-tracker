[package]
name = "anilog-tauri"
version = "0.7.2"
description = "Local-first anime schedule, notification, and watch-task tracker"
authors = ["SH1N15"]
license = "MIT"
repository = "https://github.com/SH1N15/anilog-tracker"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "anilog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
standard = []
original = []

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-autostart = "2"
tauri-winrt-notification = "0.7.3"
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
